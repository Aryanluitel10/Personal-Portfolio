<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aryan Luitel — Résumé</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #232620; background: #f5f4ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px 4%; border-bottom: 1px solid #d9dcd0; background: #f5f4ee;
      position: sticky; top: 0; z-index: 2;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    a {
      color: inherit; text-decoration: none; font-size: 13px;
      border: 1px solid #d9dcd0; border-radius: 6px; padding: 10px 14px;
    }
    a.primary { background: #273320; color: #fff; border-color: #273320; }
    a:hover { opacity: .9; }
    main { flex: 1; padding: 16px 4% 32px; }
    object, embed, iframe {
      width: 100%; height: calc(100vh - 110px); min-height: 70vh;
      border: 1px solid #d9dcd0; border-radius: 8px; background: #fff;
    }
    .fallback {
      margin-top: 18px; padding: 20px; border: 1px dashed #c5cbb8; border-radius: 8px;
      background: #eceee5; max-width: 520px;
    }
    .fallback p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: #5a6650; }
  </style>
</head>
<body>
  <header>
    <h1>Aryan Luitel — Résumé</h1>
    <div class="actions">
      <a class="primary" href="Resume.pdf" download="Aryan_Luitel_Resume.pdf">Download PDF</a>
      <a href="./">Back to portfolio</a>
    </div>
  </header>
  <main>
    <object data="Resume.pdf#view=FitH" type="application/pdf" aria-label="Résumé PDF">
      <iframe src="Resume.pdf" title="Résumé PDF"></iframe>
    </object>
    <div class="fallback">
      <p>If the résumé doesn’t appear above (common in some in-app browsers), download the PDF or open it in Chrome or Safari.</p>
      <a class="primary" href="Resume.pdf" target="_blank" rel="noreferrer">Open PDF directly</a>
    </div>
  </main>
</body>
</html>
